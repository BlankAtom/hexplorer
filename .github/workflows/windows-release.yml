name: Windows build and release

on:
  pull_request:
    paths:
      - 'Qt/**'
      - '.github/workflows/windows-release.yml'
      - '.github/workflows/release-please.yml'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout-ref:
        description: Exact release commit to build
        type: string
        default: ''
      release-tag:
        description: Stable tag created by Release Please; empty for build-only calls
        type: string
        default: ''
      draft-release-id:
        description: Existing draft created by Release Please; never overwrite a published release
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.release-tag || inputs.checkout-ref || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      QT_QUICK_BACKEND: software
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout-ref || github.sha }}
          fetch-depth: 0
      - name: Record exact source commit
        id: source
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve source commit.' }
          "sha=$sha" >> $env:GITHUB_OUTPUT
      - name: Validate version and release tag
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ inputs.release-tag }}
          DRAFT_RELEASE_ID: ${{ inputs.draft-release-id }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          $version = (Get-Content Qt\VERSION.txt -Raw).Trim()
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'VERSION must be a stable major.minor.patch version.'
          }
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -cne "v$version") {
            throw "Release tag must equal v$version."
          }
          $tag = $env:RELEASE_TAG
          if (!$tag -and $env:REF_TYPE -eq 'tag') { $tag = $env:REF_NAME }
          if ($tag) {
            if ($tag -cne "v$version") { throw "Release tag $tag does not match VERSION v$version." }
            $tagSha = git rev-parse --verify "refs/tags/$tag^{commit}"
            if ($LASTEXITCODE -ne 0 -or $tagSha -ne $env:SOURCE_SHA) {
              throw 'The release tag must point to the exact source commit being built.'
            }
          }
          if ($env:RELEASE_TAG -and $env:DRAFT_RELEASE_ID -notmatch '^[1-9]\d*$') {
            throw 'Reusable publication requires the draft release ID from Release Please.'
          }
          if (!$env:RELEASE_TAG -and $env:DRAFT_RELEASE_ID) {
            throw 'A draft release ID requires an explicit release tag.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install Qt
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true
      - name: Build, test and deploy portable application
        shell: pwsh
        env:
          QT_SDK: ${{ steps.qt.outputs.qt-root-dir }}
        run: |
          if (!(Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Ninja.' }
          }
          .\Qt\scripts\build.ps1 -QtRoot $env:QT_SDK -Test -Package
      - name: Compile per-user Windows installer
        shell: pwsh
        run: |
          $compiler = .\Qt\scripts\install-inno.ps1
          .\Qt\scripts\package-windows.ps1 -Iscc $compiler
      - name: Verify standalone deployed version and UI
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $exe = (Resolve-Path Qt\dist\HExplorer\HExplorer.exe).Path
          $versionLog = Join-Path $env:RUNNER_TEMP 'version.txt'
          $versionProcess = Start-Process $exe -ArgumentList '--version' -RedirectStandardOutput $versionLog -Wait -PassThru
          if ($versionProcess.ExitCode -ne 0) { throw 'Version command failed.' }
          $expected = "HExplorer " + (Get-Content Qt\VERSION.txt -Raw).Trim()
          if ((Get-Content $versionLog -Raw).Trim() -ne $expected) { throw 'Command-line version mismatch.' }
          $log = Join-Path $env:RUNNER_TEMP 'portable-smoke.log'
          $process = Start-Process $exe -ArgumentList "--smoke-test --smoke-log `"$log`"" -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($process.ExitCode -ne 0) { throw 'Portable smoke test failed.' }
      - name: Verify installation and upgrade in an isolated directory
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = (Resolve-Path "Qt\dist\HExplorer-$env:VERSION-windows-x64-setup.exe").Path
          $target = Join-Path $env:RUNNER_TEMP 'HExplorer-installed-test'
          $log = Join-Path $env:RUNNER_TEMP 'installer.log'
          $mutex = [Threading.Mutex]::new($false, 'Local\HExplorer.Running.61B21CF7-348E-47DF-9D69-744A8F5DA8B7')
          try {
            $blocked = Start-Process $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`" /LOG=`"$log`"" -Wait -PassThru
            if ($blocked.ExitCode -eq 0 -or (Test-Path (Join-Path $target 'HExplorer.exe'))) {
              throw 'Installer ignored the running-application lock.'
            }
          } finally {
            $mutex.Dispose()
          }
          # Repeat with the same AppId and directory to exercise in-place upgrade.
          1..2 | ForEach-Object {
            $process = Start-Process $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`" /LOG=`"$log`"" -Wait -PassThru
            if ($process.ExitCode -ne 0) { Get-Content $log; throw 'Installer failed.' }
          }
          $exe = Join-Path $target 'HExplorer.exe'
          if ((Get-Item $exe).VersionInfo.ProductVersion -ne $env:VERSION) { throw 'Installed version mismatch.' }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $process = Start-Process $exe -ArgumentList "--smoke-test --smoke-log `"$env:RUNNER_TEMP\installed-smoke.log`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\installed-smoke.log"; throw 'Installed smoke test failed.' }
          $uninstall = Start-Process (Join-Path $target 'unins000.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed.' }
      - name: Generate release checksums
        shell: pwsh
        run: |
          $assets = Get-ChildItem Qt\dist -File | Where-Object { $_.Extension -in '.zip', '.exe' }
          $lines = $assets | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          [IO.File]::WriteAllLines((Join-Path $PWD 'Qt\dist\SHA256SUMS.txt'), [string[]]$lines, [Text.UTF8Encoding]::new($false))
      - name: Upload Windows release assets
        uses: actions/upload-artifact@v6
        with:
          name: windows-release-${{ steps.source.outputs.sha }}
          if-no-files-found: error
          path: |
            Qt/dist/HExplorer-*.zip
            Qt/dist/HExplorer-*-windows-x64-setup.exe
            Qt/dist/HExplorer-*-windows-x64-setup.exe.sha256
            Qt/dist/SHA256SUMS.txt
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-diagnostics-${{ steps.source.outputs.sha || github.job }}
          path: |
            Qt/build/Testing/Temporary/
            Qt/build/*smoke*.log
            ${{ runner.temp }}/installer.log
            ${{ runner.temp }}/*smoke.log

  release:
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') ||
       (github.ref == 'refs/heads/main' && inputs.release-tag != '' && inputs.draft-release-id != ''))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-release-${{ needs.build.outputs.sha }}
          path: assets
      - name: Publish stable release after every asset is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release-tag || github.ref_name }}
          DRAFT_RELEASE_ID: ${{ inputs.draft-release-id }}
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          sha256sum --check SHA256SUMS.txt
          if [[ -n "$DRAFT_RELEASE_ID" ]]; then
            release_id="$DRAFT_RELEASE_ID"
            gh api "repos/$GH_REPO/releases/$DRAFT_RELEASE_ID" > ../draft-release.json
            python3 - <<'PY'
          import json, os
          release = json.load(open("../draft-release.json", encoding="utf-8"))
          if (str(release["id"]) != os.environ["DRAFT_RELEASE_ID"]
                  or release["tag_name"] != os.environ["RELEASE_TAG"]
                  or not release["draft"] or release["prerelease"] or release["assets"]):
              raise SystemExit("Expected an empty stable draft from Release Please; no assets were changed")
          PY
            gh release upload "$RELEASE_TAG" ./*
          else
            # Manual tag pushes create their own draft; existing releases are never overwritten.
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "HExplorer $RELEASE_TAG" --generate-notes ./*
            release_id=$(gh release view "$RELEASE_TAG" --json databaseId --jq '.databaseId')
          fi
          gh api "repos/$GH_REPO/releases/$release_id" > ../release-assets.json
          python3 - <<'PY'
          import json, pathlib
          release = json.loads(pathlib.Path("../release-assets.json").read_text())
          if not release["draft"] or release["tag_name"] != __import__("os").environ["RELEASE_TAG"]:
              raise SystemExit("Refusing to edit a published or mismatched release")
          assets = release["assets"]
          import hashlib
          expected = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path(".").glob("*-setup.exe")}
          found = {a["name"]: a.get("digest") for a in assets if a["name"] in expected}
          if not expected or any(found.get(name) != "sha256:" + digest for name, digest in expected.items()):
              raise SystemExit("GitHub installer digests do not match; leave the release draft for review")
          PY
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -F draft=false -f make_latest=true > /dev/null
