name: Windows build and release

on:
  pull_request:
    paths: ['Qt/**', '.github/workflows/windows-release.yml']
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      QT_QUICK_BACKEND: software
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate version and release tag
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Get-Content Qt\VERSION.txt -Raw).Trim()
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'VERSION must be a stable major.minor.patch version.'
          }
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -cne "v$version") {
            throw "Release tag must equal v$version."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Install Qt
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtimageformats
          cache: true
      - name: Build, test and deploy portable application
        shell: pwsh
        env:
          QT_SDK: ${{ steps.qt.outputs.qt-root-dir }}
        run: |
          if (!(Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Ninja.' }
          }
          .\Qt\scripts\build.ps1 -QtRoot $env:QT_SDK -Test -Package
      - name: Compile per-user Windows installer
        shell: pwsh
        run: |
          $compiler = .\Qt\scripts\install-inno.ps1
          .\Qt\scripts\package-windows.ps1 -Iscc $compiler
      - name: Verify standalone deployed version and UI
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $exe = (Resolve-Path Qt\dist\HExplorer\HExplorer.exe).Path
          $versionLog = Join-Path $env:RUNNER_TEMP 'version.txt'
          $versionProcess = Start-Process $exe -ArgumentList '--version' -RedirectStandardOutput $versionLog -Wait -PassThru
          if ($versionProcess.ExitCode -ne 0) { throw 'Version command failed.' }
          $expected = "HExplorer " + (Get-Content Qt\VERSION.txt -Raw).Trim()
          if ((Get-Content $versionLog -Raw).Trim() -ne $expected) { throw 'Command-line version mismatch.' }
          $log = Join-Path $env:RUNNER_TEMP 'portable-smoke.log'
          $process = Start-Process $exe -ArgumentList "--smoke-test --smoke-log `"$log`"" -Wait -PassThru
          if (Test-Path $log) { Get-Content $log }
          if ($process.ExitCode -ne 0) { throw 'Portable smoke test failed.' }
      - name: Verify installation and upgrade in an isolated directory
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $installer = (Resolve-Path "Qt\dist\HExplorer-$env:VERSION-windows-x64-setup.exe").Path
          $target = Join-Path $env:RUNNER_TEMP 'HExplorer-installed-test'
          $log = Join-Path $env:RUNNER_TEMP 'installer.log'
          $mutex = [Threading.Mutex]::new($false, 'Local\HExplorer.Running.61B21CF7-348E-47DF-9D69-744A8F5DA8B7')
          try {
            $blocked = Start-Process $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`" /LOG=`"$log`"" -Wait -PassThru
            if ($blocked.ExitCode -eq 0 -or (Test-Path (Join-Path $target 'HExplorer.exe'))) {
              throw 'Installer ignored the running-application lock.'
            }
          } finally {
            $mutex.Dispose()
          }
          # Repeat with the same AppId and directory to exercise in-place upgrade.
          1..2 | ForEach-Object {
            $process = Start-Process $installer -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR=`"$target`" /LOG=`"$log`"" -Wait -PassThru
            if ($process.ExitCode -ne 0) { Get-Content $log; throw 'Installer failed.' }
          }
          $exe = Join-Path $target 'HExplorer.exe'
          if ((Get-Item $exe).VersionInfo.ProductVersion -ne $env:VERSION) { throw 'Installed version mismatch.' }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $process = Start-Process $exe -ArgumentList "--smoke-test --smoke-log `"$env:RUNNER_TEMP\installed-smoke.log`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\installed-smoke.log"; throw 'Installed smoke test failed.' }
          $uninstall = Start-Process (Join-Path $target 'unins000.exe') -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed.' }
      - name: Generate release checksums
        shell: pwsh
        run: |
          $assets = Get-ChildItem Qt\dist -File | Where-Object { $_.Extension -in '.zip', '.exe' }
          $lines = $assets | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          [IO.File]::WriteAllLines((Join-Path $PWD 'Qt\dist\SHA256SUMS.txt'), [string[]]$lines, [Text.UTF8Encoding]::new($false))
      - name: Upload Windows release assets
        uses: actions/upload-artifact@v6
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            Qt/dist/HExplorer-*.zip
            Qt/dist/HExplorer-*-windows-x64-setup.exe
            Qt/dist/HExplorer-*-windows-x64-setup.exe.sha256
            Qt/dist/SHA256SUMS.txt
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-diagnostics
          path: |
            Qt/build/Testing/Temporary/
            Qt/build/*smoke*.log
            ${{ runner.temp }}/installer.log
            ${{ runner.temp }}/*smoke.log

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-release
          path: assets
      - name: Publish stable release after every asset is uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd assets
          sha256sum --check SHA256SUMS.txt
          # A draft prevents the application seeing a half-published update.
          # An existing tag release is not overwritten: review failed drafts manually.
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "HExplorer $RELEASE_TAG" --generate-notes ./*
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release-assets.json
          python3 - <<'PY'
          import json, pathlib
          assets = json.loads(pathlib.Path("release-assets.json").read_text())["assets"]
          import hashlib
          expected = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path(".").glob("*-setup.exe")}
          found = {a["name"]: a.get("digest") for a in assets if a["name"] in expected}
          if not expected or any(found.get(name) != "sha256:" + digest for name, digest in expected.items()):
              raise SystemExit("GitHub installer digests do not match; leave the release draft for review")
          PY
          gh release edit "$RELEASE_TAG" --draft=false --latest
